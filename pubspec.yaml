name: agente_cine
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1

  # Inyección de dependencias
  get_it: ^8.0.2
  injectable: ^2.5.0

  # Navegación
  go_router: ^14.6.2

  # Red
  dio: ^5.7.0
  # retrofit: ^4.4.2  # Temporalmente comentado por conflictos de versión con generator

  # Base de datos local
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # Preferencias
  shared_preferences: ^2.3.3

  # Modelos inmutables
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilidades
  dartz: ^0.10.1
  equatable: ^2.0.7
  intl: ^0.20.1
  cached_network_image: ^3.4.1
  logging: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generación de código
  build_runner: ^2.4.15
  freezed: ^2.5.7
  json_serializable: ^6.9.2
  injectable_generator: ^2.6.2
  # retrofit_generator: ^9.1.2  # Temporalmente comentado
  drift_dev: ^2.22.0

  # Testing
  mocktail: ^1.0.4
  bloc_test: ^9.1.7

  # Integration testing
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
